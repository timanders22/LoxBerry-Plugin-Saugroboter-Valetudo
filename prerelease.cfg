[AUTOUPDATE]
; Vorabfassungen. Solange keine eigene gepflegt wird, stehen hier dieselbe
; Fassung und dieselben Adressen wie in der release.cfg. Eine prerelease.cfg
; OHNE VERSION-Zeile waere der schlechteste Fall: wird sie doch einmal
; abgerufen, ist das Verhalten undefiniert.
#
# Die Adressen zeigten bis 1.0.3 auf den ALTEN Repo-Namen
# (LoxBerry-Plugin-Saugroboter, ohne "-Valetudo"). Sie stehen jetzt auf dem
# heutigen Namen. GitHub leitet nach einer Umbenennung zwar weiter - auch
# raw.githubusercontent.com, nachgeprueft -, aber ein Weiterleitungsziel ist
# nichts, worauf sich ein Auto-Update stuetzen sollte: Es verschwindet,
# sobald jemand den alten Namen neu vergibt.
#
# Bei jedem Release VERSION und beide Adressen auf den neuen Tag anpassen.

VERSION=1.1.3
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Saugroboter-Valetudo/archive/refs/tags/v1.1.3.zip

INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Saugroboter-Valetudo/releases/tag/v1.1.3
