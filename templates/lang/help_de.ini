; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.
;
; Die Adressen unten sind VOLLSTAENDIG - mit &token=. Bis 1.0.14 standen
; sie hier ohne, und wer sie abschrieb, bekam HTTP 403 vom eigenen Plugin.
; Das eigene Token steht im Reiter "Einbindung in Loxone"; unten steht ein
; Platzhalter.

[HILFE]
K01 = "Saugroboter (Valetudo)"
K02 = "Bindet einen Saugroboter mit der cloudfreien Firmware <b>Valetudo</b> an Loxone an — mit <b>einer</b> Abfrage statt vier und einer sauberen <b>Statuszahl</b> statt zusammengesuchter Textbruchstücke. Steuerbefehle laufen als einfache GET-Aufrufe, die Loxone direkt als virtuellen Ausgang senden kann (Valetudo verlangt sonst PUT mit JSON-Rumpf)."
K03 = "Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4</b> (reines PHP, PHP 7.4 und 8.x)."
K04 = "Funktionen"
K05 = "<b>Ein Endpunkt</b> fasst Zustand, Anbauteile, Ladestation, Stufen, Statistik und Verbrauchsmaterial zusammen — ein virtueller Eingang alle 30 Sekunden genügt"
K06 = "<b>Statuszahl</b> für Loxone: 0 in der Ladestation, 1 bereit, 2 reinigt, 3 pausiert, 4 fährt zur Station, 5 fährt, 8 unbekannt, 9 Fehler"
K07 = "Batterie, Ladezustand, Herstellerfehlercode mit Schwere und betroffenem Teil"
K08 = "Anbauteile (Staubbehälter, Wassertank, Wischmodul) und der Zustand der Absaugstation"
K09 = "<b>Verbrauchsmaterial</b> in Reststunden bzw. Prozent — Filter, Bürsten, Sensoren, Räder, Wischbezug, dazu die Teile der Station — mit eigener Warnschwelle je Einheit"
K10 = "<b>Valetudo-Ereignisse</b>: Staubbehälter voll, Verbrauchsteil aufgebraucht, Wischmodul prüfen, Störung — als eigene Werte für Loxone und als Ansage"
K11 = "<b>Steuerung</b> per GET: starten, stoppen, pausieren, heimschicken, piepsen, Räume, Zonen, Position anfahren, Saugstärke, Wischwasser, Betriebsart, Absaugstation auslösen, Verbrauchsteil zurücksetzen, Ruhezeit setzen"
K12 = "<b>Meldungen</b>: Reinigung fertig, Störung, Wartung fällig, Valetudo-Ereignis — als Ansage (TTS) und/oder Push über Loxone"
K13 = "Bis zu <b>2 Roboter</b>, MQTT mit Lebenszeichen, JSON, Selbstprüfung, Protokoll mit Rotation"
K14 = "Endpunkte"
K19 = "Aufruf"
K20 = "Zweck"
K21 = "<code>/plugins/saugrobo/robo.php</code>"
K22 = "Loxone-Zeile <code>ROBO;OK=..;CODE=..;BATT=..;…</code>"
K23 = "<code>/plugins/saugrobo/robo.php?dev=2</code>"
K24 = "derselbe Abruf für den zweiten Roboter"
K25 = "<code>/plugins/saugrobo/robo.php?json=1</code>"
K26 = "kompletter Zustand als JSON, inklusive Raumliste"
K27 = "<code>/plugins/saugrobo/robo.php?debug=1</code>"
K28 = "Klartext-Auskunft mit Fähigkeiten und Raumliste"
K29 = "<code>/plugins/saugrobo/robo.php?cmd=start&amp;token=IHRTOKEN</code>"
K30 = "Reinigung starten (auch <code>stop</code>, <code>pause</code>, <code>home</code>, <code>locate</code>, <code>absaugen</code>)"
K31 = "<code>/plugins/saugrobo/robo.php?cmd=segments&amp;p=1,4&amp;token=IHRTOKEN</code>"
K32 = "nur bestimmte Räume reinigen; <code>1,4x2</code> reinigt sie zweimal"
K33 = "<code>/plugins/saugrobo/robo.php?cmd=fan&amp;p=max&amp;token=IHRTOKEN</code>"
K34 = "Saugstärke setzen (auch <code>wasser</code> und <code>modus</code>)"
K35 = "<code>/plugins/saugrobo/robo.php?cmd=reset&amp;p=filter/main&amp;token=IHRTOKEN</code>"
K36 = "Verbrauchsteil nach dem Wechsel zurücksetzen"
K37 = "<code>/plugins/saugrobo/robo.php?selftest=1&amp;token=IHRTOKEN</code>"
K38 = "prüft das Token, ohne etwas auszulösen"
K39 = "<b>Ohne passendes <code>&amp;token=</code> antwortet jeder schaltende Aufruf mit HTTP 403.</b> Das aktuelle Token steht im Reiter „Einbindung in Loxone“; dort erzeugen die beiden Vorlagen-Knöpfe auch fertige Dateien für Loxone Config, in denen es schon eingetragen ist."
K40 = "Lebenszeichen"
K41 = "Ein virtueller Eingang behält seinen letzten Wert. Fällt der Minutencron aus, steht in Loxone weiter der Wert vom Zeitpunkt des Ausfalls — das ist keine fehlende Auskunft, sondern eine Falschaussage. Legen Sie deshalb <code>ALTER</code> (Sekunden seit dem letzten Lauf) oder <code>ZAEHLER</code> (läuft 0…999 um) auf eine Überwachung. Über MQTT heißen sie <code>&lt;präfix&gt;/status/ts</code> und <code>&lt;präfix&gt;/status/zaehler</code>."
K42 = "MQTT-Gateway"
K43 = "Unter <b>Gateway V1</b> muss das Abo von Hand eingetragen werden — System &rarr; MQTT Gateway &rarr; Subscriptions, Wert <code>&lt;präfix&gt;/#</code>. Ohne diesen Eintrag kommt am Miniserver nichts an; das ist die häufigste Fehlerursache überhaupt. Unter <b>Gateway V2</b> erscheint die Themengruppe von selbst. Der Reiter MQTT misst, welche Fassung installiert ist, und zeigt nur den Satz, der zu Ihrer Anlage passt."
K15 = "Voraussetzung"
K16 = "Auf dem Roboter läuft <b>Valetudo</b> (Fassung mit <code>/api/v2</code>). Es werden keine Cloud-Dienste benötigt — die Kommunikation bleibt im eigenen Netz. Hat Valetudo eine Anmeldung eingeschaltet (HTTP Basic Auth), tragen Sie Benutzer und Kennwort im Reiter Einstellungen ein."
K17 = "Datenschutz"
K18 = "Es sind <b>keine persönlichen Daten</b> im Plugin enthalten. Adressen und Einstellungen liegen ausschließlich lokal (<code>config/plugins/saugrobo/robo.json</code>). Diese Datei trägt das Aktionstoken und gegebenenfalls die Anmeldung an Valetudo; dasselbe gilt für die Sicherungsdatei, die der Knopf im Reiter Einstellungen erzeugt — behandeln Sie beide wie ein Passwort."
