; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Saugroboter (Valetudo)"
K02 = "Bindet einen Saugroboter mit der cloudfreien Firmware <b>Valetudo</b> an Loxone an — mit <b>einer</b> Abfrage statt vier und einer sauberen <b>Statuszahl</b> statt zusammengesuchter Textbruchstücke. Steuerbefehle laufen als einfache GET-Aufrufe, die Loxone direkt als virtuellen Ausgang senden kann (Valetudo verlangt sonst PUT mit JSON-Rumpf)."
K03 = "Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4</b> (reines PHP, PHP 7.4 und 8.x)."
K04 = "Funktionen"
K05 = "<b>Ein Endpunkt</b> fasst Status, Statistik (aktuell und gesamt) und Verbrauchsmaterial zusammen — statt vier virtuellen Eingängen im 10-Sekunden-Takt genügt einer alle 30 Sekunden"
K06 = "<b>Statuszahl</b> für Loxone: 0 Ladestation, 1 bereit, 2 reinigt, 3 pausiert, 4 fährt zur Station, 5 fährt, 9 Fehler"
K07 = "Batterie, Ladezustand, Fehlercode und Fehlertext"
K08 = "Letzte Reinigung (m²/Minuten) und Gesamtwerte (m², Stunden, Anzahl)"
K09 = "<b>Verbrauchsmaterial</b> in Reststunden (Filter, Haupt-/Seitenbürste, Sensoren) mit frei wählbarer Warnschwelle → <code>MATWARN</code>"
K10 = "<b>Steuerung</b> per GET: <code>start</code>, <code>stop</code>, <code>pause</code>, <code>home</code>, <code>locate</code>, Raumreinigung (<code>segments</code>), Saugstärke (<code>fan</code>), gespeicherte Position (<code>goto</code>)"
K11 = "<b>Meldungen</b>: Reinigung fertig (mit Fläche und Dauer), Störung, Wartung fällig — als Ansage (TTS) und/oder Push über Loxone"
K12 = "Bis zu <b>2 Roboter</b>, MQTT, JSON (inkl. Raumliste), Protokoll mit Rotation"
K13 = "Reiter: Einstellungen, Einbindung in Loxone (mit kompletter Baustein-Liste), Test (inkl. Segment-IDs und ungefährlichem „Piepsen“-Test), Protokoll"
K14 = "Endpunkte"
K15 = "Voraussetzung"
K16 = "Auf dem Roboter läuft <b>Valetudo</b> (Version mit <code>/api/v2</code>). Es werden keine Cloud-Dienste und keine Zugangsdaten benötigt — die Kommunikation bleibt im eigenen Netz."
K17 = "Datenschutz"
K18 = "Es sind <b>keine persönlichen Daten</b> im Plugin enthalten. Adresse und Einstellungen liegen ausschließlich lokal (<code>config/plugins/saugrobo/robo.json</code>)."
K19 = "Aufruf"
K20 = "Zweck"
K21 = "<code>/plugins/saugrobo/robo.php</code>"
K22 = "Loxone-Zeile <code>ROBO;OK=..;CODE=..;BATT=..;FILTER=..;MATWARN=..;…</code>"
K23 = "<code>/plugins/saugrobo/robo.php?debug=1</code>"
K24 = "Klartext inkl. Raumliste"
K25 = "<code>/plugins/saugrobo/robo.php?json=1</code>"
K26 = "kompletter Zustand als JSON"
K27 = "<code>/plugins/saugrobo/robo.php?cmd=start</code>"
K28 = "Reinigung starten (auch <code>stop</code>, <code>pause</code>, <code>home</code>, <code>locate</code>)"
K29 = "<code>/plugins/saugrobo/robo.php?cmd=segments&amp;p=1,4</code>"
K30 = "nur bestimmte Räume reinigen"
K31 = "<code>/plugins/saugrobo/robo.php?cmd=fan&amp;p=max</code>"
K32 = "Saugstärke setzen"
