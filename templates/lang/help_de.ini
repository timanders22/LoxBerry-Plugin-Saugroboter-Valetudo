; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.
;
; Die Adressen unten sind VOLLSTAENDIG - mit &token=. Bis 1.0.14 standen
; sie hier ohne, und wer sie abschrieb, bekam HTTP 403 vom eigenen Plugin.
; Das eigene Token steht im Reiter "Einbindung in Loxone"; unten steht ein
; Platzhalter.

[HILFE]
K01 = "Saugroboter (Valetudo)"
K02 = "Bindet Saugroboter an Loxone an – mit der cloudfreien Firmware <b>Valetudo</b> oder als <b>Xiaomi-Saugroboter direkt über miIO</b> (ohne Valetudo, im Heimnetz; am Gerät gemessen mit dem Xiaomi Robot Vacuum T12 <code>xiaomi.vacuum.b106bk</code>: Start, Heimfahrt, Status, Fehlerwerte), bis zu fünf Roboter gemischt. Bei Valetudo <b>eine</b> Abfrage statt vier und eine saubere <b>Statuszahl</b> statt zusammengesuchter Textbruchstücke; den Token eines Xiaomi-Roboters holt das Plugin aus der Xiaomi-Cloud. Die Werte gehen per MQTT an das MQTT-Gateway (Virtuelle Eingänge), Befehle über die Befehlsbrücke (zwei Haken, ab Werk aus). Der bisherige Weg mit einfachen GET-Aufrufen und Aktionstoken bleibt für bestehende Anlagen."
K03 = "Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4</b> (reines PHP, PHP 7.4 und 8.x)."
K04 = "Funktionen"
K05 = "<b>Ein Endpunkt</b> fasst Zustand, Anbauteile, Ladestation, Stufen, Statistik und Verbrauchsmaterial zusammen — ein virtueller Eingang alle 30 Sekunden genügt"
K06 = "<b>Statuszahl</b> für Loxone: 0 in der Ladestation, 1 bereit, 2 reinigt, 3 pausiert, 4 fährt zur Station, 5 fährt, 8 unbekannt, 9 Fehler"
K07 = "Batterie, Ladezustand, Herstellerfehlercode mit Schwere und betroffenem Teil"
K08 = "Anbauteile (Staubbehälter, Wassertank, Wischmodul) und der Zustand der Absaugstation"
K09 = "<b>Verbrauchsmaterial</b> in Reststunden bzw. Prozent — Filter, Bürsten, Sensoren, Räder, Wischbezug, dazu die Teile der Station — mit eigener Warnschwelle je Einheit"
K10 = "<b>Valetudo-Ereignisse</b>: Staubbehälter voll, Verbrauchsteil aufgebraucht, Wischmodul prüfen, Störung — als eigene Werte für Loxone und als Ansage"
K11 = "<b>Steuerung</b> über MQTT (Befehlsbrücke, Thema <code>saugrobo/befehl/&lt;name&gt;</code>, Quittung auf <code>…/quittung</code>) und per GET mit Token: starten, stoppen, pausieren, heimschicken, piepsen, Räume, Zonen, Position anfahren, Saugstärke, Wischwasser, Betriebsart, Absaugstation auslösen, Verbrauchsteil zurücksetzen, Ruhezeit, Ereignis quittieren"
K12 = "<b>Meldungen</b>: Reinigung fertig, Störung, Wartung fällig, Valetudo-Ereignis — als Ansage (TTS) und/oder Push über Loxone"
K13 = "Bis zu <b>5 Roboter</b>, MQTT mit Lebenszeichen (Werte als Virtuelle Eingänge nach der Namenstabelle im Reiter „Einbindung in Loxone“), Befehle über MQTT (zwei Haken im Reiter MQTT, ab Werk aus), JSON, Selbstprüfung, Protokoll mit Rotation"
K14 = "Endpunkte"
K19 = "Aufruf"
K20 = "Zweck"
K21 = "<code>/plugins/saugrobo/robo.php</code>"
K22 = "Loxone-Zeile <code>ROBO;OK=..;CODE=..;BATT=..;…</code>"
K23 = "<code>/plugins/saugrobo/robo.php?dev=2</code> … <code>?dev=5</code>"
K24 = "derselbe Abruf für Roboter 2 bis 5"
K25 = "<code>/plugins/saugrobo/robo.php?json=1</code>"
K26 = "kompletter Zustand als JSON, inklusive Raumliste"
K27 = "<code>/plugins/saugrobo/robo.php?debug=1</code>"
K28 = "Klartext-Auskunft mit Fähigkeiten und Raumliste"
K29 = "<code>/plugins/saugrobo/robo.php?cmd=start&amp;token=IHRTOKEN</code>"
K30 = "Reinigung starten (auch <code>stop</code>, <code>pause</code>, <code>home</code>, <code>locate</code>, <code>absaugen</code>)"
K31 = "<code>/plugins/saugrobo/robo.php?cmd=segments&amp;p=1,4&amp;token=IHRTOKEN</code>"
K32 = "nur bestimmte Räume reinigen; <code>1,4x2</code> reinigt sie zweimal"
K33 = "<code>/plugins/saugrobo/robo.php?cmd=fan&amp;p=max&amp;token=IHRTOKEN</code>"
K34 = "Saugstärke setzen (auch <code>wasser</code> und <code>modus</code>)"
K35 = "<code>/plugins/saugrobo/robo.php?cmd=reset&amp;p=filter/main&amp;token=IHRTOKEN</code>"
K36 = "Verbrauchsteil nach dem Wechsel zurücksetzen"
K37 = "<code>/plugins/saugrobo/robo.php?selftest=1&amp;token=IHRTOKEN</code>"
K38 = "prüft das Token, ohne etwas auszulösen"
K39 = "<b>Ohne passendes <code>&amp;token=</code> antwortet jeder schaltende Aufruf mit HTTP 403.</b> Das aktuelle Token steht im Reiter „Einbindung in Loxone“; dort erzeugen die beiden Vorlagen-Knöpfe auch fertige Dateien für Loxone Config, in denen es schon eingetragen ist."
K40 = "Lebenszeichen"
K41 = "Ein virtueller Eingang behält seinen letzten Wert. Fällt der Minutencron aus, steht in Loxone weiter der Wert vom Zeitpunkt des Ausfalls — das ist keine fehlende Auskunft, sondern eine Falschaussage. Legen Sie deshalb <code>ALTER</code> (Sekunden seit dem letzten Lauf) oder <code>ZAEHLER</code> (läuft 0…999 um) auf eine Überwachung. <b>ALTER über 180 s heißt: Meldungen, <code>ANN</code> und die MQTT-Werte kommen nicht mehr.</b> <code>OK</code> und die übrigen Werte der Zeile bleiben richtig, denn der Endpunkt fragt den Roboter selbst; deshalb hängt <code>OK</code> nicht an <code>ALTER</code>. Über MQTT heißen sie <code>&lt;präfix&gt;/status/ts</code> und <code>&lt;präfix&gt;/status/zaehler</code>."
K42 = "MQTT-Gateway"
K43 = "Unter <b>Gateway V1</b> braucht der Miniserver das Abo <code>&lt;präfix&gt;/#</code>. Das Plugin trägt es selbst in <code>config/plugins/saugrobo/mqtt_subscriptions.cfg</code> ein und führt es bei einem Präfixwechsel nach; das Gateway liest diese Datei. Fehlt dort etwas, hilft der Eintrag von Hand (System → MQTT Gateway → Subscriptions). Unter <b>Gateway V2</b> erscheint die Themengruppe von selbst. Gesendet werden nur geänderte Werte, alle 30 Minuten der volle Satz; <code>ok</code> und das Lebenszeichen in jedem Lauf. Nach einem Präfixwechsel, dem Ausschalten von MQTT oder dem Austragen eines Roboters räumt der Minutenlauf die zurückbehaltenen Werte im Broker ab und liest dort nach."
K44 = "Wenn der Roboter nicht antwortet"
K45 = "Dann steht <code>OK=0</code> und <code>CODE=8</code> (nicht erreichbar). Alle übrigen Werte bleiben auf dem letzten Messwert — Batterie, Verbrauchsteile, Fehlercode —, am Endpunkt wie über MQTT. Über MQTT geht nur <code>ok 0</code> und <code>code 8</code> hinaus, <code>code 8</code> flüchtig; der Broker behält den letzten gemessenen Stand. Liefert nur eine Teilabfrage nichts (Statistik, Verbrauchsteile, Ereignisse), gilt für diese Gruppe dasselbe. In Loxone gilt ein Wert deshalb nur zusammen mit <code>OK</code>; Schwellwertschalter an <code>CODE</code> sehen die 8."
K46 = "Gleiche Sollwerte werden nicht doppelt gesendet: <code>fan</code>, <code>wasser</code>, <code>modus</code> und <code>ruhezeit</code> mit demselben Wert innerhalb von 60 s antworten <code>CMD;OK=1;…;UNVERAENDERT=1</code> und gehen nicht an Valetudo. Aufträge wie <code>start</code>, <code>stop</code>, <code>home</code> und Raumreinigungen wirken immer."
K47 = "Ansage über Alexa-NG"
K48 = "Als Ausgabeweg der Sprachausgabe lässt sich das eigene Plugin <b>Alexa-NG</b> wählen (ab Werk nicht gewählt): https://github.com/timanders22/LoxBerry-Plugin-Alexa-NG. Eingetragen werden Echo-Gerät, Lautstärke und das Sprechtoken aus dem Reiter von Alexa-NG. Das Sprechtoken wird wie ein Kennwort behandelt: es steht nie in der Seite und nicht in der Sicherung. Gesprochen heißt: Alexa-NG antwortet <code>SPRECHEN;OK=1</code>; sonst nennen Protokoll und Reiter Test HTTP-Code und Grund. Der Knopf Testansage im Reiter Test prüft den ganzen Weg."
K15 = "Voraussetzung"
K16 = "Entweder läuft auf dem Roboter <b>Valetudo</b> (Fassung mit <code>/api/v2</code>) – dann werden keine Cloud-Dienste benötigt, die Kommunikation bleibt im eigenen Netz; hat Valetudo eine Anmeldung eingeschaltet (HTTP Basic Auth), tragen Sie Benutzer und Kennwort im Reiter Einstellungen ein. Oder es ist ein <b>Xiaomi-Saugroboter</b> mit der Mi-Home-App (Gerätetyp „Xiaomi“): auch er wird im Heimnetz angesprochen (miIO, UDP 54321, mit seinem Token); nur das Holen des Tokens meldet sich einmal bei Xiaomi an."
K17 = "Datenschutz"
K18 = "Es sind <b>keine persönlichen Daten</b> im Plugin enthalten. Adressen und Einstellungen liegen ausschließlich lokal (<code>config/plugins/saugrobo/robo.json</code>). Diese Datei trägt das Aktionstoken und gegebenenfalls die Anmeldung an Valetudo; dasselbe gilt für die Sicherungsdatei, die der Knopf im Reiter Einstellungen erzeugt — behandeln Sie beide wie ein Passwort."
K49 = "Ansage über Google-Lautsprecher (Chromecast 4 Lox NG)"
K50 = "Als Ausgabeweg der Sprachausgabe lässt sich das Plugin <b>Chromecast 4 Lox NG</b> auf diesem LoxBerry wählen (ab Fassung 1.3.15; ab Werk nicht gewählt). Dort im Reiter Einstellungen, Abschnitt Sprachausgabe für andere Plugins, die Sprachausgabe einschalten, ein Sprechtoken festlegen und wahlweise ein Standardgerät; hier Lautsprecher, Lautstärke und dieses Sprechtoken eintragen - es ist ein anderes als das von Alexa-NG. Das Sprechtoken wird wie ein Kennwort behandelt: es steht nie in der Seite und nicht in der Sicherung. Gesendet heißt: Chromecast 4 Lox NG antwortet <code>SPRECHEN;OK=1</code> und hat die Ansage bei den verbundenen Lautsprechern eingereiht; derselbe Text binnen 30 s gilt als gesendet (<code>UNVERAENDERT</code>), wird aber nicht wiederholt. Sonst entfällt die Ansage - es wird nicht auf einen anderen Lautsprecher gewechselt -, und Protokoll und Reiter Test nennen HTTP-Code und Grund. Der Knopf Testansage im Reiter Test zeigt die Antwort."
K51 = "Xiaomi ohne Valetudo (Treiber „Xiaomi MIoT“, z. B. T12)"
K52 = "Je Roboterzeile wählt das Feld <b>Gerätetyp</b> den Treiber. Ein Xiaomi-Saugroboter ohne Valetudo (Belegung je Modell aus der MIoT-Spezifikation: Xiaomi T12 <code>xiaomi.vacuum.b106bk</code>, dazu <code>xiaomi.vacuum.c103</code>; andere Modelle mit Warnung im Reiter Test) wird im Heimnetz über miIO angesprochen (UDP 54321, AES mit seinem <b>Token</b>, kein Cloud-Weg im Betrieb). Er liefert dieselben Themen wie Valetudo: Zustand (Statuszahl; ein Firmware-Update erscheint als 8 bei OK=1), Fehler (9), Akku, Betriebsart, Saugstufe. <b>Was der T12 nicht meldet, steht in Loxone auf -1; was er nicht kann, quittiert das Plugin mit „nicht unterstützt“.</b> Befehle: start, stop, home, fan (low/medium/high/max), modus (vacuum, vacuum_and_mop, mop; vacuum_then_mop nur c103), segments (Raum-IDs, bis zum Gerätetest ungeprüft). Ereignisse gibt es beim T12 nicht. Die Fehlerwerte 2100 bis 2199 des T12 (gemessen: 2105 in der Station, 2108 beim Reinigen) sind Hinweise, kein Fehler – der Rohwert steht im Reiter Test; andere Werte meldet das Plugin als „MIoT-Fehler n“. Beim Reinigen nennt der Status die Tätigkeit, z. B. „reinigt (wischt)“ – die Statuszahl bleibt 2 wie bei Valetudo."
K53 = "Wie man an den Token kommt"
K54 = "<b>Im Plugin:</b> Reiter Einstellungen, „Token aus der Xiaomi-Cloud holen“ – Mi-Home-Konto, Kennwort und Region (Deutschland meist <code>de</code>); Kennwort und Anmeldung werden nicht gespeichert und nicht protokolliert; verlangt Xiaomi ein Captcha, erscheint das Bild von Xiaomi und Sie tippen die Zeichen ab (mit erneutem Kennwort); verlangt Xiaomi einen Zweitfaktor, wählen Sie Mail oder SMS und tragen den Code ein – alles 10 Minuten gültig, das Plugin löst und umgeht nichts. Die gefundenen Saugroboter erscheinen mit Kästchen (vorangehakt: von der Cloud als online gemeldet); „Ausgewählte übernehmen“ trägt alle angehakten in einem Zug ein – wer schon eine Xiaomi-Zeile hat, bekommt dort nur Token und Adresse aufgefrischt. <b>Oder mit dem Xiaomi Cloud Tokens Extractor</b> (github.com/PiotrMachowski/Xiaomi-cloud-tokens-extractor): anmelden, Region wählen, beim Saugroboter die Zeile <code>TOKEN</code> (32 Zeichen) in das Feld „Token (Xiaomi)“ kopieren, Gerätetyp „Xiaomi“, IP aus derselben Liste. <b>Der Token ändert sich, wenn der Roboter neu mit der App verbunden wird.</b> Der Reiter Test prüft danach ohne Bewegung: Gruß, Token, Raum-IDs, Modell."
K55 = "HTTP-Lesezweig (endpunkt_ein)"
K56 = "Seit 1.1.23 antwortet <code>robo.php</code> auf die Zeile, <code>?json=1</code> und <code>?debug=1</code> nur mit dem Haken „HTTP-Lesezweig für Loxone annehmen“ (Reiter Einbindung, Abschnitt „Bestehende Anlagen: HTTP-Endpunkt“) – nach einem Update an, bei einer Neuinstallation aus (sonst HTTP 403 <code>GRUND=ENDPUNKT_AUS</code>). Befehle mit Token, <code>?ptest=1</code> und <code>?selftest=1</code> bleiben erreichbar."
