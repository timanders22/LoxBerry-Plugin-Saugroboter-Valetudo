; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Vacuum robot (Valetudo)"
K02 = "Connects a vacuum robot running the cloud-free firmware <b>Valetudo</b> to Loxone — with <b>one</b> query instead of four and a clean <b>state number</b> instead of text fragments pieced together. Control commands run as simple GET calls that Loxone can send directly as a virtual output (Valetudo otherwise requires PUT with a JSON body)."
K03 = "Compatible with LoxBerry 3.x and <b>LoxBerry 4</b> (pure PHP, PHP 7.4 and 8.x)."
K04 = "Features"
K05 = "<b>One endpoint</b> combines state, statistics (current and total) and consumables — instead of four virtual inputs polling every 10 seconds, one every 30 seconds is enough"
K06 = "<b>State number</b> for Loxone: 0 docked, 1 ready, 2 cleaning, 3 paused, 4 returning to the dock, 5 moving, 9 error"
K07 = "Battery, charging state, error code and error text"
K08 = "Last clean (m²/minutes) and totals (m², hours, count)"
K09 = "<b>Consumables</b> in remaining hours (filter, main and side brush, sensors) with a freely chosen warning threshold → <code>MATWARN</code>"
K10 = "<b>Control</b> by GET: <code>start</code>, <code>stop</code>, <code>pause</code>, <code>home</code>, <code>locate</code>, room cleaning (<code>segments</code>), suction power (<code>fan</code>), saved position (<code>goto</code>)"
K11 = "<b>Messages</b>: cleaning finished (with area and duration), fault, maintenance due — as an announcement (TTS) and/or push through Loxone"
K12 = "Up to <b>2 robots</b>, MQTT, JSON (including the room list), log with rotation"
K13 = "Tabs: Settings, Loxone integration (with a complete list of blocks), Test (including segment IDs and a harmless „beep“ test), Log"
K14 = "Endpoints"
K15 = "Prerequisite"
K16 = "<b>Valetudo</b> is running on the robot (a version with <code>/api/v2</code>). No cloud services and no credentials are needed — the communication stays on your own network."
K17 = "Privacy"
K18 = "The plugin contains <b>no personal data</b>. The address and the settings are kept exclusively locally (<code>config/plugins/saugrobo/robo.json</code>)."
K19 = "Call"
K20 = "Purpose"
K21 = "<code>/plugins/saugrobo/robo.php</code>"
K22 = "Loxone line <code>ROBO;OK=..;CODE=..;BATT=..;FILTER=..;MATWARN=..;…</code>"
K23 = "<code>/plugins/saugrobo/robo.php?debug=1</code>"
K24 = "Plain text including the room list"
K25 = "<code>/plugins/saugrobo/robo.php?json=1</code>"
K26 = "complete state as JSON"
K27 = "<code>/plugins/saugrobo/robo.php?cmd=start</code>"
K28 = "Start cleaning (also <code>stop</code>, <code>pause</code>, <code>home</code>, <code>locate</code>)"
K29 = "<code>/plugins/saugrobo/robo.php?cmd=segments&amp;p=1,4</code>"
K30 = "clean only certain rooms"
K31 = "<code>/plugins/saugrobo/robo.php?cmd=fan&amp;p=max</code>"
K32 = "set the suction power"
