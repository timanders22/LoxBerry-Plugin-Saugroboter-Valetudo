; Help texts, English. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help is not escaped on output.
;
; The addresses below are COMPLETE - including &token=. Up to 1.0.14 they
; were listed without it, and whoever copied them got HTTP 403 from the
; plugin itself.

[HILFE]
K01 = "Robot vacuum (Valetudo)"
K02 = "Connects a robot vacuum running the cloud-free firmware <b>Valetudo</b> to Loxone — with <b>one</b> request instead of four and a clean <b>status number</b> instead of scraped text fragments. Control commands are plain GET requests that Loxone can send directly as a virtual output (Valetudo otherwise expects PUT with a JSON body)."
K03 = "Compatible with LoxBerry 3.x and <b>LoxBerry 4</b> (pure PHP, PHP 7.4 and 8.x)."
K04 = "Features"
K05 = "<b>One endpoint</b> combines state, attachments, dock, presets, statistics and consumables — one virtual input every 30 seconds is enough"
K06 = "<b>Status number</b> for Loxone: 0 docked, 1 idle, 2 cleaning, 3 paused, 4 returning, 5 moving, 8 unknown, 9 error"
K07 = "Battery, charging state, vendor error code with severity and affected subsystem"
K08 = "Attachments (dust bin, water tank, mop) and the state of the auto-empty dock"
K09 = "<b>Consumables</b> in remaining hours or percent — filter, brushes, sensors, wheels, mop pad, plus the parts of the dock — with a separate warning threshold per unit"
K10 = "<b>Valetudo events</b>: dust bin full, consumable depleted, check the mop, fault — as separate values for Loxone and as a spoken announcement"
K11 = "<b>Control</b> via GET: start, stop, pause, send home, locate, rooms, zones, go to a position, fan speed, water usage, operation mode, trigger the auto-empty dock, reset a consumable, set the do-not-disturb period"
K12 = "<b>Messages</b>: cleaning finished, fault, maintenance due, Valetudo event — as an announcement (TTS) and/or push via Loxone"
K13 = "Up to <b>2 robots</b>, MQTT with heartbeat, JSON, self-check, log with rotation"
K14 = "Endpoints"
K19 = "Request"
K20 = "Purpose"
K21 = "<code>/plugins/saugrobo/robo.php</code>"
K22 = "Loxone line <code>ROBO;OK=..;CODE=..;BATT=..;…</code>"
K23 = "<code>/plugins/saugrobo/robo.php?dev=2</code>"
K24 = "the same request for the second robot"
K25 = "<code>/plugins/saugrobo/robo.php?json=1</code>"
K26 = "complete state as JSON, including the room list"
K27 = "<code>/plugins/saugrobo/robo.php?debug=1</code>"
K28 = "plain-text information with capabilities and room list"
K29 = "<code>/plugins/saugrobo/robo.php?cmd=start&amp;token=YOURTOKEN</code>"
K30 = "start cleaning (also <code>stop</code>, <code>pause</code>, <code>home</code>, <code>locate</code>, <code>absaugen</code>)"
K31 = "<code>/plugins/saugrobo/robo.php?cmd=segments&amp;p=1,4&amp;token=YOURTOKEN</code>"
K32 = "clean selected rooms only; <code>1,4x2</code> cleans them twice"
K33 = "<code>/plugins/saugrobo/robo.php?cmd=fan&amp;p=max&amp;token=YOURTOKEN</code>"
K34 = "set the fan speed (also <code>wasser</code> and <code>modus</code>)"
K35 = "<code>/plugins/saugrobo/robo.php?cmd=reset&amp;p=filter/main&amp;token=YOURTOKEN</code>"
K36 = "reset a consumable after replacing it"
K37 = "<code>/plugins/saugrobo/robo.php?selftest=1&amp;token=YOURTOKEN</code>"
K38 = "checks the token without triggering anything"
K39 = "<b>Without a matching <code>&amp;token=</code> every switching request answers with HTTP 403.</b> Your token is shown on the tab Loxone integration; the two template buttons there also produce ready-made files for Loxone Config with the token already filled in."
K40 = "Heartbeat"
K41 = "A virtual input keeps its last value. If the minute cron fails, Loxone keeps showing the value from the moment of failure — that is not missing information but a false statement. Put <code>ALTER</code> (seconds since the last run) or <code>ZAEHLER</code> (wraps around 0…999) on a watchdog. <b>ALTER above 180 s means: messages, <code>ANN</code> and the MQTT values no longer arrive.</b> <code>OK</code> and the other values of the line stay correct, because the endpoint asks the robot itself; that is why <code>OK</code> does not depend on <code>ALTER</code>. Via MQTT they are called <code>&lt;prefix&gt;/status/ts</code> and <code>&lt;prefix&gt;/status/zaehler</code>."
K42 = "MQTT gateway"
K43 = "With <b>gateway V1</b> the Miniserver needs the subscription <code>&lt;prefix&gt;/#</code>. The plugin enters it itself into <code>config/plugins/saugrobo/mqtt_subscriptions.cfg</code> and updates it after a prefix change; the gateway reads that file. If something is missing there, an entry by hand helps (System → MQTT Gateway → Subscriptions). With <b>gateway V2</b> the topic group appears by itself. Only changed values are sent, the full set every 30 minutes; <code>ok</code> and the heartbeat in every run. After a prefix change, switching MQTT off or removing a robot, the minute run clears the retained values in the broker and reads back there."
K44 = "When the robot does not answer"
K45 = "Then <code>OK=0</code> and <code>CODE=8</code> (not reachable). All other values stay at the last measurement — battery, consumables, error code —, at the endpoint as well as via MQTT. Via MQTT only <code>ok 0</code> and <code>code 8</code> go out, <code>code 8</code> not retained; the broker keeps the last measured state. If only a partial query fails (statistics, consumables, events), the same applies to that group. In Loxone a value is therefore only valid together with <code>OK</code>; threshold switches on <code>CODE</code> see the 8."
K46 = "Equal set values are not sent twice: <code>fan</code>, <code>wasser</code>, <code>modus</code> and <code>ruhezeit</code> with the same value within 60 s answer <code>CMD;OK=1;…;UNVERAENDERT=1</code> and do not go to Valetudo. Jobs such as <code>start</code>, <code>stop</code>, <code>home</code> and room cleanings always act."
K47 = "Announcement via Alexa-NG"
K48 = "The own plugin <b>Alexa-NG</b> can be chosen as output of the announcements (not chosen by default): https://github.com/timanders22/LoxBerry-Plugin-Alexa-NG. Enter the Echo device, volume and the speak token from the Alexa-NG tab. The speak token is treated like a password: it is never in the page and not in the backup. Spoken means: Alexa-NG answers <code>SPRECHEN;OK=1</code>; otherwise log and Test tab name HTTP code and reason. The Test announcement button in the Test tab checks the whole way."
K15 = "Prerequisite"
K16 = "The robot runs <b>Valetudo</b> (a version with <code>/api/v2</code>). No cloud services are required — communication stays inside your own network. If Valetudo has authentication switched on (HTTP Basic Auth), enter user and password on the Settings tab."
K17 = "Privacy"
K18 = "The plugin contains <b>no personal data</b>. Addresses and settings are stored locally only (<code>config/plugins/saugrobo/robo.json</code>). That file carries the action token and, if configured, the Valetudo login; the same applies to the backup file produced by the button on the Settings tab — treat both like a password."
