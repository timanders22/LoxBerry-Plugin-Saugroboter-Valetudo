PORT_MIOT = "miIO, fest 54321"
MIOT_HINWEIS = "Ein <b>Xiaomi-Saugroboter ohne Valetudo</b> (Treiber „Xiaomi MIoT“, Belegung je Modell: Xiaomi T12 xiaomi.vacuum.b106bk, xiaomi.vacuum.c103) wird direkt im Heimnetz über das miIO-Protokoll angesprochen (UDP 54321, verschlüsselt mit seinem Token). Er liefert Zustand, Fehler, Akku, Betriebsart und Saugstufe; was er nicht meldet, steht in Loxone auf -1. Befehle: Start, Stopp, zur Station, Saugstufe, Betriebsart, Räume – was er nicht kann, quittiert das Plugin mit „nicht unterstützt“. Port, Benutzer und Kennwort gelten nur für Valetudo."
TOKEN_HINWEIS = "Den <b>Token</b> liest man aus dem eigenen Mi-Home-Konto aus – unten mit „Token aus der Xiaomi-Cloud holen“ oder mit dem Xiaomi Cloud Tokens Extractor (Anleitung unten). Er wird nur hier gespeichert (Datei 0600, in der Sicherung wie das Kennwort), nie angezeigt und nie ins Protokoll geschrieben. Ein leeres Feld behält den gespeicherten Token, der Haken „löschen“ entfernt ihn. <b>Der Token ändert sich, wenn der Roboter neu mit der App verbunden wird.</b>"

