WAS_IST_DAS = "<b>Saugroboter am Loxone Miniserver – mit der cloudfreien Firmware Valetudo oder als Xiaomi-Saugroboter direkt über miIO (z. B. Xiaomi T12, ohne Valetudo), bis zu fünf Roboter gemischt.</b> Das Plugin fragt jede Minute (Cron, ohne eigenen Dienst) Zustand, Akku, letzte Reinigung, Verbrauchsmaterial und Anbauteile ab – bei Valetudo über dessen Schnittstelle, beim Xiaomi-Roboter direkt im Heimnetz mit seinem Token (was er nicht meldet, steht auf -1) – und schickt sie mit einer Statuszahl per MQTT an das MQTT-Gateway – in Loxone als Virtuelle Eingänge. Steuerbefehle nimmt die Befehlsbrücke über MQTT an und reicht sie an den Roboter weiter; sie ist ab Werk aus und wird mit zwei Haken eingeschaltet. Der bisherige HTTP-Weg mit Aktionstoken bleibt für bestehende Anlagen. Fertige Reinigung, Fehler und fällige Wartung sagt es auf Wunsch auch an. Den Token eines Xiaomi-Roboters holt das Plugin auf Wunsch aus der Xiaomi-Cloud (unten auf dieser Seite)."
TTS_ART_HINWEIS = "Auswahlfeld: über welchen Lautsprecher dieses Plugin spricht. Ab Werk „Loxone Music Server“ ohne Adresse – gesendet wird erst mit eingetragener Adresse und gesetztem Haken „Audioausgabe aktiv“ unter Meldungen."
