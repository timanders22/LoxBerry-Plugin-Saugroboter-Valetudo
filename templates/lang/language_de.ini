[BAUSTEIN]
TEXT = "Drei Seiten aus dem LoxBerry-Plugins Musterprojekt, jede Zeile ein Baustein (Baustein-Suche in Loxone Config: Taste <b>F5</b>). Die erste zeigt Zustand und Akku, meldet Störungen und saugt auf Wunsch automatisch, wenn niemand da ist – sie genügt für den Anfang. Die zweite zeigt, was am Roboter und an der Station fällig ist, dazu Fehler, Ereignisse und die Reinigungsbilanz. Die dritte legt alle übrigen Befehle als Tasten in die App. Die Eingänge heißen wie das MQTT-Gateway sie benennt (Schritt 3), die Befehle hängen am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ (Schritt 5); die Listen gelten für Roboter 1."
T_TYP = "Baustein (Typ)"
T_NAME = "Name"
T_PARAM = "Parameter"
T_VERB = "Eingänge verbinden mit"
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
HINWEISE_TITEL = "Hinweise"
S1_SCHRITT1 = "Eingänge anlegen: die Virtuellen Eingänge dieser Seite (#1–#8, #22, #24, #26, #27) und den Virtuellen Texteingang #49 nach der Namenstabelle („%s“ oben) anlegen, Name genau so. Wer die Seite aus dem Musterprojekt kopiert, hat sie schon."
S1_SCHRITT2 = "Die Eingänge auf die Seite ziehen; „Als Digitaleingang verwenden“ nicht anhaken. Startwert laut Spalte Parameter (#1 = 8, #2 = -1) – er gilt nur als Rückfallwert, bis der erste Wert kommt."
S1_SCHRITT3 = "#21: den Befehl „%s“ am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ anlegen (Seite „LoxBerry MQTT-Gateway“ des Musterprojekts; Befehl bei EIN wie in der Tabelle) und auf die Seite ziehen."
S1_SCHRITT4 = "Neu anlegen unter Virtuelle Eingänge, „In Visualisierung verwenden“ an: #20 (Eingabeart Taster), #29 (Eingabeart Schalter), #30 (digital, ohne Visualisierung)."
S1_SCHRITT5 = "#30 ist der Haus-Wert haus_anwesenheit_jemand vom BLE-Scanner NG (dort den Haus-Wert haus/anwesenheit einschalten; im Gateway die Haken bzw. das Abo haus/anwesenheit/# setzen). #52 prüft dessen Lebenszeichen: schweigt die Quelle zwei Minuten, saugt die Automatik nicht. Ohne BLE-Scanner: #30 durch die eigene Anwesenheit ersetzen (1 = jemand da) und #31 als NICHT wie bisher."
S1_SCHRITT6 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, die Parameter aus der Tabelle eintragen und nach der Spalte „%s“ verbinden."
S1_SCHRITT7 = "Den RS-Impulsschalter #37 von Hand verbinden: S = Ausgang Q von #33, R = #36; seinen Ausgang Q an #42 (I2) und an #44 (V2)."
S1_SCHRITT8 = "Betriebszeitzähler #48: Freigabe an #35, „Alles zurücksetzen“ an Ausgang Q von #47 (Impuls um 00:00), „In Visualisierung verwenden“ an."
S1_SCHRITT9 = "Benachrichtigungen (#12, #13, #19, #25): Peripherie → Mitteilungen → Benachrichtigung, Empfänger wählen; je Baustein genau eine Quelle."
S1_SCHRITT10 = "Im Plugin, Reiter „%s“, Abschnitt „%s“: „%s“ und die gewünschten Anlässe anhaken (sonst bleibt #12 still)."
S1_SCHRITT11 = "Im Plugin, Reiter „%s“: „%s“ und „%s“ anhaken – sonst wirken weder die Taste noch die Automatik (Status #28 sagt es)."
S1_H1 = "Saugen starten (Taste) und die Automatik laufen über das ODER #43 in den einen Befehl %s – ein Ausgangsbefehl darf in Loxone nur einmal eingefügt werden."
S1_H2 = "Die Automatik startet nur, wenn der Roboter in der Station steht oder bereit ist (Zustand 0 oder 1), erreichbar ist und der Akku mindestens 60 %% hat (#45, Aus unter 55 %%)."
S1_H3 = "Saugfenster und 10 Minuten in #32–#34 frei anpassen; wer nur Werktage will, setzt eine Schaltuhr vor #29."
S1_H4 = "#28 zeigt, ob das Plugin läuft, ob sein Befehlsdienst läuft und welche Meldewege im Plugin eingeschaltet sind; die Störmeldung kommt aus #15–#19."
S1_H5 = "Die Analogwertvalidierung bekommt an En die Konstante 1; steht der Zähler saugrobo_status_zaehler länger als Tmc, meldet ihr Ausgang E. Kein Alter aus saugrobo_status_ts rechnen – Loxone rechnet in Ortszeit, die Ausfallerkennung nimmt den Zähler."
S1_H5_EN = "Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
S1_H6 = "Alle Störungen laufen über ODER in eine Benachrichtigung; ein Benachrichtigungsbaustein bekommt nur eine Quelle. Ein ODER hat zwei Eingänge – für drei Quellen zwei ODER (#16 und #17)."
S1_H7 = "Saugroboter Wartung (#13) meldet, sobald ein Verbrauchsteil fällig ist (%s); was fällig ist, zeigt die Seite unten."
S1_H8 = "Original-Audioserver: die Ansage in Config über %s bauen; die Ansage des Plugins selbst steht im Reiter „%s“, Abschnitt „%s“."
S1_H9 = "Für Roboter 2 bis 5 heißen die Eingänge %s… (für 3 bis 5 die 3, 4 oder 5 statt der 2; eigene Namenstabelle je eingerichtetem Roboter) und die Befehle %s/befehl/<n>/…; das Lebenszeichen gibt es nur einmal."
S2_SCHRITT1 = "Neue Seite „Saugroboter Wartung“ anlegen. Die Eingänge stammen aus der Namenstabelle (Schritt 3)."
S2_SCHRITT2 = "27 Virtuelle Eingänge auf die Seite ziehen (#1–#8, #10–#13, #17, #22–#24, #26–#28, #31–#33, #37–#41), %s (#26) ein zweites Mal; Startwert laut Spalte Parameter."
S2_SCHRITT3 = "Den Virtuellen Texteingang %s (#43) anlegen, Name genau so, „In Visualisierung verwenden“ an."
S2_SCHRITT4 = "2 Befehle am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“: %s (#16) und %s (#36), Befehl bei EIN wie in der Tabelle."
S2_SCHRITT5 = "2 Virtuelle Eingänge als Taster anlegen, „In Visualisierung verwenden“ an: #15 und #35."
S2_SCHRITT6 = "8 Status, 1 Gleich, 1 Einschaltverzögerung und 1 Benachrichtigung über die Baustein-Suche (Taste F5) setzen, die Parameter aus der Tabelle eintragen und nach der Spalte „%s“ verbinden."
S2_SCHRITT7 = "Die Status-Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein (#9 braucht V1–V8, #42 V1–V5)."
S2_SCHRITT8 = "Statuszeilen von oben nach unten eintragen – die erste erfüllte gewinnt; die Zeile ohne Bedingung ganz unten."
S2_SCHRITT9 = "Warnschwellen angleichen: stehen im Plugin (Reiter „%s“, „%s“ und „%s“) andere Werte als 10 Stunden bzw. 10 Prozent, dieselben Zahlen in #9 und #14 eintragen."
S2_H1 = "-1 heißt immer: dieses Teil hat bzw. meldet Ihr Gerät nicht. Die Statuszeilen mit „>= 0“ übergehen es."
S2_H2 = "Die Pushnachricht „Wartung fällig“ kommt von der Seite „Saugroboter“ (#13); diese Seite zeigt, was fällig ist."
S2_H3 = "„Filter gewechselt“ setzt den Zähler im Roboter zurück – nur nach dem echten Wechsel drücken. Für ein anderes Teil im Befehl %s den Wert ändern (Spalte Parameter); der Befehl steht im ganzen Projekt nur einmal."
S2_H4 = "„Station gestört“ meldet Fehler der Station; Fehler des Roboters meldet „Saugroboter gestört“ auf der Seite „Saugroboter“."
S3_SCHRITT1 = "Neue Seite „Saugroboter Steuerung“ anlegen."
S3_SCHRITT2 = "4 Virtuelle Eingänge ziehen: %s (ein zweites Mal), %s, %s und %s (#1–#4); Startwert laut Spalte Parameter."
S3_SCHRITT3 = "14 Befehle am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ anlegen und ziehen (#9, #11, #20, #22, #24, #26, #28, #30, #32, #34, #36, #38, #40, #42), Name und Befehl bei EIN wie in der Tabelle."
S3_SCHRITT4 = "14 Virtuelle Eingänge als Taster neu anlegen, „In Visualisierung verwenden“ an (#8, #10, #12, #21, #23, #25, #27, #29, #31, #33, #35, #37, #39, #41)."
S3_SCHRITT5 = "„Anwesenheit (eigene Quelle)“ (#13) und „Saugen, wenn niemand da“ (#14) ein zweites Mal aus dem Baum auf die Seite ziehen."
S3_SCHRITT6 = "3 Status, 1 Gleich, 1 Flankenerkennung, 2 UND und 1 ODER über die Baustein-Suche (Taste F5) setzen, die Parameter eintragen und nach der Spalte „%s“ verbinden."
S3_SCHRITT7 = "Vor dem ersten Druck auf „Ausgewählte Räume saugen“, „Zone saugen“ und „Position anfahren“: eigene Werte in den Befehl eintragen (Doppelklick auf den Befehl im Baum → „Befehl bei EIN“)."
S3_SCHRITT8 = "Im Plugin, Reiter „%s“: „%s“ und „%s“ anhaken – alle Befehle dieser Seite außer „piepsen lassen“ greifen ein. Speichern und in den Miniserver übertragen."
S3_H1 = "Jeder Befehl trägt genau einen festen Wert. Wer eine andere Saugstufe, andere Räume oder eine andere Ruhezeit will, ändert den Wert im Befehl („Befehl bei EIN“); zwei Stufen nebeneinander gehen nur mit einem zweiten, selbst angelegten Befehl in der Vorlage."
S3_H2 = "Die Raum-IDs zeigt der Reiter „%s“ unter „%s“. Kartenkoordinaten für %s und %s zeigt das Plugin nicht."
S3_H3 = "„Sauger heim“ wirkt auch automatisch: Ist „Saugen, wenn niemand da“ an und kommt während der Reinigung jemand heim, fährt der Roboter zur Station."
S3_H4 = "Absaugen, Wischmodul waschen und trocknen wirken nur, wenn der Roboter eine solche Station hat (Reiter „%s“, „%s“)."
S3_H5 = "Saugen starten steht auf der Seite „Saugroboter“ (der Befehl %s darf nur einmal im Projekt stehen)."
S1_SCHRITT12 = "Speichern und in den Miniserver übertragen. Probe: Reiter „%s“ → „%s“ – #25 muss eine Nachricht aufs Telefon schicken."
S1_SCHRITT13 = "Automatik: Schalter #29 in der App einschalten. Ab dem nächsten Morgen 9:00 saugt der Roboter einmal am Tag, sobald seit 10 Minuten niemand mehr zu Hause ist (bis 18 Uhr) und der Akku mindestens 60 %% hat."
S1_H10 = "Reinigungsdauer heute (#48) zählt nur, während der Roboter reinigt, und steht um Mitternacht wieder auf 0."
S2_SCHRITT10 = "Benachrichtigung #21: Peripherie → Mitteilungen → Benachrichtigung, Empfänger wählen. Speichern und in den Miniserver übertragen."
S2_H5 = "Meldet das Gerät keine Reinigungsbilanz, stehen #37–#41 auf -1, und #42 sagt „das Gerät meldet keine Reinigungsbilanz“."
S3_H6 = "Jeder Befehl wird quittiert: die Antwort steht auf saugrobo/befehl/<Name>/quittung („angenommen“ oder „abgelehnt: Grund“). Derselbe Auftrag binnen 5 s und dieselbe Wartung binnen 60 s werden abgelehnt; Saugstärke, Wischwasser, Betriebsart und Ruhezeit prüft das Plugin selbst (gleicher Wert binnen 60 s: unverändert)."
Z1_01 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Saugroboter (Valetudo)) | saugrobo_code | Zustand: 0 Ladestation, 1 bereit, 2 reinigt, 3 pausiert, 4 fährt zur Station, 5 fährt, 8 unbekannt, 9 Fehler; Startwert 8 (weitere Instanz auf Seite „Saugroboter Steuerung“) | —"
Z1_02 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Saugroboter (Valetudo)) | saugrobo_batt | Akku in %%; -1 = meldet das Gerät nicht (Startwert -1) | —"
