ERLAEUTERUNG = "<b>Zu {B1} bis {B4}:</b> Titel, Adressen und Befehle stehen hier so, wie die Vorlagen-Knöpfe sie erzeugen. Loxone Config legt beim Import neu an und überschreibt nichts – zweimal eingelesen ergibt doppelte Bausteine. Für Roboter 2 gilt dieselbe Liste mit den Vorlagen für Roboter 2 (Auswahl über den Knöpfen).<br><b>Zu {B2}:</b> Das führende Semikolon der Befehlserkennung gehört dazu (siehe Schritt 2).<br><b>Zu {B18} und {B19}:</b> Der Benachrichtigungs-Baustein sendet nur bei einer steigenden Flanke. Wer mehrere Quellen hat, führt sie über {B18} zusammen (weitere über ein zweites ODER davor) und nicht über mehrere Bausteine – sonst kommen zwei Nachrichten.<br><b>Zu {B24}:</b> {F:ALTER} über 180 s heißt: Meldungen und Meldefenster kommen nicht mehr. Die übrigen Werte bleiben richtig, denn der Endpunkt fragt den Roboter selbst.<br><b>Zu {B26} bis {B29}:</b> Abwesenheit, Anwesenheit, Zeitfenster und Reinigung beendet kommen aus der eigenen Anlage (z. B. Anwesenheit, Schaltuhr). Drei Bedingungen brauchen zwei UND hintereinander ({B26} und {B27}) – ein UND bekommt hier nie mehr als zwei Eingänge."
