S1_SCHRITT1 = "Vorlagen holen: oben unter „%s“ (Roboter 1) die Knöpfe „%s“ und „%s“ drücken und die beiden Dateien in Loxone Config einlesen (Peripherie → Virtuelle Eingänge bzw. Virtuelle Ausgänge → Vorlage importieren). Nur einmal einlesen – zweimal ergibt doppelte Bausteine."
S1_SCHRITT2 = "#1–#8, #22, #24, #26 und #27: die Befehle aus dem Baum unter „%s“ auf die Seite ziehen; nichts einstellen."
S1_SCHRITT3 = "#21: den Befehl „%s“ aus „%s“ auf die Seite ziehen."
S1_SCHRITT4 = "Neu anlegen unter Virtuelle Eingänge, „In Visualisierung verwenden“ an: #20 (Eingabeart Taster), #29 (Eingabeart Schalter), #30 (digital, ohne Visualisierung)."
S1_SCHRITT5 = "#30 ersetzen: im eigenen Projekt statt dieses Platzhalters den eigenen Anwesenheits-Ausgang an #31 legen (1 = jemand da). Wer keine Anwesenheit hat: #30 als Schalter „Ich bin weg“ in der App anlegen und das NICHT #31 weglassen."
S1_SCHRITT6 = "Die übrigen Bausteine über die Baustein-Suche (Taste F5) setzen, die Parameter aus der Tabelle eintragen und nach der Spalte „%s“ verbinden."
S1_SCHRITT7 = "Den RS-Impulsschalter #37 von Hand verbinden: S = Ausgang Q von #33, R = #36; seinen Ausgang Q an #42 (I2) und an #44 (V2)."
S1_SCHRITT8 = "Benachrichtigungen (#12, #13, #19, #25): Peripherie → Mitteilungen → Benachrichtigung, Empfänger wählen; je Baustein genau eine Quelle."
S1_SCHRITT9 = "Im Plugin, Reiter „%s“, Abschnitt „%s“: „%s“ und die gewünschten Anlässe anhaken (sonst bleibt #12 still)."
S1_SCHRITT10 = "Speichern und in den Miniserver übertragen. Probe: Reiter „%s“ → „%s“ – #25 muss eine Nachricht aufs Telefon schicken."
S1_SCHRITT11 = "Automatik: Schalter #29 in der App einschalten. Ab dem nächsten Morgen 9:00 saugt der Roboter einmal am Tag, sobald seit 10 Minuten niemand mehr zu Hause ist (bis 18 Uhr)."
S1_H1 = "Saugen starten (Taste) und die Automatik laufen über das ODER #43 in den einen Befehl %s – ein Ausgangsbefehl darf in Loxone nur einmal eingefügt werden."
S1_H2 = "Die Automatik startet nur, wenn der Roboter in der Station steht oder bereit ist (Zustand 0 oder 1) und erreichbar ist."
S1_H3 = "Saugfenster und 10 Minuten in #32–#34 frei anpassen; wer nur Werktage will, setzt eine Schaltuhr vor #29."
S1_H4 = "#28 zeigt, ob das Plugin läuft und welche Meldewege im Plugin eingeschaltet sind; die Störmeldung kommt aus #15–#19."
S1_H5 = "Die Analogwertvalidierung prüft nur mit der Konstante 1 an En; steht der Laufzähler länger als Tmc, meldet ihr Ausgang E."
S1_H6 = "Alle Störungen laufen über ODER in eine Benachrichtigung; ein Benachrichtigungsbaustein bekommt nur eine Quelle. Ein ODER hat zwei Eingänge – für drei Quellen zwei ODER (#16 und #17)."
S1_H7 = "Saugroboter Wartung (#13) meldet, sobald ein Verbrauchsteil fällig ist (%s); was fällig ist, zeigt die Seite unten."
S1_H8 = "Original-Audioserver: die Ansage in Config über %s bauen; die Ansage des Plugins selbst steht im Reiter „%s“, Abschnitt „%s“."
S1_H9 = "Für Roboter 2 gelten dieselben drei Seiten mit den Vorlagen für Roboter 2 (Auswahl „%s“ über den Knöpfen); die Namen tragen dann _2. Das führende Semikolon der Befehlserkennung gehört dazu (Schritt 2) – in den Vorlagen steht es schon."
S2_SCHRITT1 = "Neue Seite „Saugroboter Wartung“ anlegen. Keine neue Vorlage – beide sind seit der Seite oben eingelesen."
S2_SCHRITT2 = "27 Befehle aus „%s“ auf die Seite ziehen (#1–#8, #10–#13, #17, #22–#24, #26–#28, #31–#33, #37–#41); %s (#26) ein zweites Mal."
S2_SCHRITT3 = "2 Befehle aus „%s“ ziehen: %s (#16) und %s (#36)."
S2_SCHRITT4 = "2 Virtuelle Eingänge als Taster anlegen, „In Visualisierung verwenden“ an: #15 und #35."
S2_SCHRITT5 = "8 Status, 1 Gleich, 1 Einschaltverzögerung und 1 Benachrichtigung über die Baustein-Suche (Taste F5) setzen, die Parameter aus der Tabelle eintragen und nach der Spalte „%s“ verbinden."
S2_SCHRITT6 = "Die Status-Eingänge ab V5 erscheinen erst nach Klick auf das „+“ am Baustein (#9 braucht V1–V8, #42 V1–V5)."
S2_SCHRITT7 = "Statuszeilen von oben nach unten eintragen – die erste erfüllte gewinnt; die Zeile ohne Bedingung ganz unten."
S2_SCHRITT8 = "Warnschwellen angleichen: stehen im Plugin (Reiter „%s“, „%s“ und „%s“) andere Werte als 10 Stunden bzw. 10 Prozent, dieselben Zahlen in #9 und #14 eintragen."
S2_SCHRITT9 = "Benachrichtigung #21: Peripherie → Mitteilungen → Benachrichtigung, Empfänger wählen. Speichern und in den Miniserver übertragen."
S2_H1 = "-1 heißt immer: dieses Teil hat bzw. meldet Ihr Gerät nicht. Die Statuszeilen mit „>= 0“ übergehen es."
S2_H2 = "Die Pushnachricht „Wartung fällig“ kommt von der Seite „Saugroboter“ (#13); diese Seite zeigt, was fällig ist."
S2_H3 = "„Filter gewechselt“ setzt den Zähler im Roboter zurück – nur nach dem echten Wechsel drücken. Für ein anderes Teil im Befehl %s den Wert ändern (Spalte Parameter); der Befehl steht im ganzen Projekt nur einmal."
S2_H4 = "„Station gestört“ meldet Fehler der Station; Fehler des Roboters meldet „Saugroboter gestört“ auf der Seite „Saugroboter“."
S3_SCHRITT1 = "Neue Seite „Saugroboter Steuerung“ anlegen. Keine neue Vorlage."
S3_SCHRITT2 = "4 Befehle aus „%s“ ziehen: %s (ein zweites Mal), %s, %s und %s (#1–#4)."
S3_SCHRITT3 = "14 Befehle aus „%s“ ziehen: %s (#9, #11, #20, #22, #24, #26, #28, #30, #32, #34, #36, #38, #40, #42)."
S3_SCHRITT4 = "14 Virtuelle Eingänge als Taster neu anlegen, „In Visualisierung verwenden“ an (#8, #10, #12, #21, #23, #25, #27, #29, #31, #33, #35, #37, #39, #41)."
S3_SCHRITT5 = "„Anwesenheit (eigene Quelle)“ (#13) und „Saugen, wenn niemand da“ (#14) ein zweites Mal aus dem Baum auf die Seite ziehen."
S3_SCHRITT6 = "3 Status, 1 Gleich, 1 Flankenerkennung, 2 UND und 1 ODER über die Baustein-Suche (Taste F5) setzen, die Parameter eintragen und nach der Spalte „%s“ verbinden."
S3_SCHRITT7 = "Vor dem ersten Druck auf „Ausgewählte Räume saugen“, „Zone saugen“ und „Position anfahren“: eigene Werte in den Befehl eintragen (Doppelklick auf den Befehl im Baum → „Befehl bei EIN“)."
S3_SCHRITT8 = "Im Plugin muss das Aktionstoken vergeben sein (oben, „%s“); die Vorlage trägt es schon. Speichern und in den Miniserver übertragen."
S3_H1 = "Jeder Befehl trägt genau einen festen Wert. Wer eine andere Saugstufe, andere Räume oder eine andere Ruhezeit will, ändert den Wert im Befehl („Befehl bei EIN“); zwei Stufen nebeneinander gehen nur mit einem zweiten, selbst angelegten Befehl in der Vorlage."
S3_H2 = "Die Raum-IDs zeigt der Reiter „%s“ unter „%s“. Kartenkoordinaten für %s und %s zeigt das Plugin nicht."
S3_H3 = "„Sauger heim“ wirkt auch automatisch: Ist „Saugen, wenn niemand da“ an und kommt während der Reinigung jemand heim, fährt der Roboter zur Station."
S3_H4 = "Absaugen, Wischmodul waschen und trocknen wirken nur, wenn der Roboter eine solche Station hat (Reiter „%s“, „%s“)."
S3_H5 = "Saugen starten steht auf der Seite „Saugroboter“ (der Befehl %s darf nur einmal im Projekt stehen)."

