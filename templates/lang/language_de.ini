ANLEITUNG_TITEL = "Anleitung: wie man an den Token kommt"
ANLEITUNG = "<b>Weg 1 – hier im Plugin:</b> unten „Token aus der Xiaomi-Cloud holen“ mit Ihrem Mi-Home-Konto (dieselbe Anmeldung wie in der App) und der Region, in der der Roboter eingebunden ist (Deutschland: meist <span class=sm-mono>de</span>; unsicher: „alle“). Das Plugin zeigt alle Saugroboter des Kontos mit Kästchen und übernimmt die angehakten in einem Zug (Token, Adresse, Gerätetyp Xiaomi). <b>Weg 2 – mit dem Xiaomi Cloud Tokens Extractor</b> (github.com/PiotrMachowski/Xiaomi-cloud-tokens-extractor, für Windows als fertige Datei token_extractor.exe, sonst <span class=sm-mono>python token_extractor.py</span>): Anmeldung mit demselben Konto, Region wählen; in der Liste steht beim Saugroboter (Modell <span class=sm-mono>xiaomi.vacuum.b106bk</span> beim T12 o. ä.) die Zeile <span class=sm-mono>TOKEN</span> mit 32 Zeichen – diese in das Feld „Token (Xiaomi)“ der Roboterzeile kopieren, Gerätetyp „Xiaomi“, Adresse = IP aus derselben Liste, speichern. <b>Der Token ändert sich, wenn der Roboter neu mit der App verbunden wird</b> – dann erneut holen. Den Token nie in ein Forum oder einen Chat kopieren."
