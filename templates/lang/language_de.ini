Z1_07 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Saugroboter (Valetudo)) | saugrobo_ok | 1 = Roboter erreichbar (kommt bei jedem Minutenlauf; unter Gateway V2 „Noncached“ anhaken) | —"
