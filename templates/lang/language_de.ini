; Sprachdatei Deutsch - LoxBerry-Plugin Saugroboter (Valetudo)
;
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt selbst keine.
; Das ist Pflicht, nicht Geschmack: parse_ini_file scheitert im Modus
; INI_SCANNER_NORMAL an runden Klammern in unquotierten Werten und liefert
; dann GAR KEINE Texte.
;
; Auszeichnung (<b>, <span class=sm-mono>) bleibt roh - die Oberflaeche
; gibt diese Werte unmaskiert aus. Werte, die maskiert ausgegeben werden,
; enthalten deshalb KEIN HTML.
;
; Suchtexte fuer Loxone stehen hier NICHT ausgeschrieben. Sie kommen aus
; ro_check() - siehe REGELN_3, Abschnitt A11.

