ERLAEUTERUNG = "<b>On {B1} to {B4}:</b> Titles, addresses and commands appear here exactly as the template buttons create them. Loxone Config creates new objects on import and overwrites nothing – importing twice gives duplicate blocks. For robot 2 the same list applies with the templates for robot 2 (selection above the buttons).<br><b>On {B2}:</b> The leading semicolon of the command recognition is part of it (see step 2).<br><b>On {B18} and {B19}:</b> The notification block only sends on a rising edge. If you have several sources, combine them through {B18} (more of them through a second OR in front) rather than several blocks – otherwise two messages arrive.<br><b>On {B24}:</b> {F:ALTER} above 180 s means: messages and the message window no longer arrive. The other values stay correct, because the endpoint queries the robot itself.<br><b>On {B26} to {B29}:</b> Absence, presence, time window and cleaning finished come from your own installation (e.g. presence, timer). Three conditions need two ANDs in a row ({B26} and {B27}) – an AND never gets more than two inputs here."
