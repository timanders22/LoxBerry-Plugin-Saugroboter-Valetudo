[BAUSTEIN]
TEXT = "Three pages from the LoxBerry plugins sample project, every row one block (block search in Loxone Config: key <b>F5</b>). The first shows state and battery, reports faults and, if you like, vacuums automatically when nobody is at home – it is enough to start with. The second shows what is due on the robot and the dock, plus errors, events and the cleaning balance. The third puts all other commands into the app as buttons. The inputs are named as the MQTT gateway names them (step 3), the commands sit on the shared output “LoxBerry MQTT-Gateway” (step 5); the lists apply to robot 1."
T_TYP = "Block (type)"
T_NAME = "Name"
T_PARAM = "Parameters"
T_VERB = "Connect inputs to"
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
S1_SCHRITT1 = "Create the inputs: the virtual inputs of this page (#1–#8, #22, #24, #26, #27) and the virtual text input #49 according to the name table (“%s” above), name exactly like this. Whoever copies the page from the sample project already has them."
S1_SCHRITT2 = "Drag the inputs onto the page; do not tick “Use as digital input”. Start value as in the column parameters (#1 = 8, #2 = -1) – it only serves as a fallback until the first value arrives."
S1_SCHRITT3 = "#21: create the command “%s” on the shared output “LoxBerry MQTT-Gateway” (page “LoxBerry MQTT-Gateway” of the sample project; command on ON as in the table) and drag it onto the page."
S1_SCHRITT4 = "Create under Virtual Inputs, “Use in visualisation” on: #20 (input type push button), #29 (input type switch), #30 (digital, without visualisation)."
S1_SCHRITT5 = "Replace #30: in your own project connect your own presence output to #31 instead of this placeholder (1 = someone at home). Without a presence source: create #30 as a switch “I am away” in the app and leave out the NOT #31."
S1_SCHRITT6 = "Place the remaining blocks via the block search (key F5), enter the parameters from the table and wire them according to the column “%s”."
S1_SCHRITT7 = "Wire the RS flip-flop #37 by hand: S = output Q of #33, R = #36; its output Q to #42 (I2) and to #44 (V2)."
S1_SCHRITT8 = "Runtime counter #48: enable to #35, “Reset all” to output Q of #47 (pulse at 00:00), “Use in visualisation” on."
S1_SCHRITT9 = "Notifications (#12, #13, #19, #25): Periphery → Messages → Notification, choose the recipients; exactly one source per block."
S1_SCHRITT10 = "In the plugin, tab “%s”, section “%s”: tick “%s” and the occasions you want (otherwise #12 stays silent)."
S1_SCHRITT11 = "In the plugin, tab “%s”: tick “%s” and “%s” – otherwise neither the button nor the automatic has an effect (status #28 says so)."
S1_H1 = "Saugen starten (button) and the automatic run through the OR #43 into the one command %s – an output command may only be inserted once in Loxone."
S1_H2 = "The automatic only starts when the robot is in the station or ready (state 0 or 1), reachable and the battery has at least 60 %% (#45, off below 55 %%)."
S1_H3 = "Adjust the cleaning window and the 10 minutes in #32–#34 as you like; for working days only, put a timer in front of #29."
S1_H4 = "#28 shows whether the plugin is running, whether its command service is running and which message channels are switched on in the plugin; the fault message comes from #15–#19."
S1_H5 = "The value validator gets the constant 1 at En; if the counter saugrobo_status_zaehler stands still for longer than Tmc, its output E reports it. Do not compute an age from saugrobo_status_ts – Loxone calculates in local time, the failure detection uses the counter."
S1_H5_EN = "Config creates input En inverted (tick at ‘En’ in the properties under Parameters). Remove this tick, otherwise constant 1 arrives as 0 and the failure message never triggers."
S1_H6 = "All faults go through OR into one notification; a notification block gets only one source. An OR has two inputs – for three sources two ORs (#16 and #17)."
S1_H7 = "Saugroboter Wartung (#13) reports as soon as a consumable is due (%s); what is due is shown on the page below."
S1_H8 = "Original Audio Server: build the announcement in Config via %s; the plugin’s own announcement is in the tab “%s”, section “%s”."
S1_H9 = "For robot 2 the inputs are called %s… (own name table as soon as robot 2 is set up) and the commands %s/befehl/2/…; the heartbeat exists only once."
S2_SCHRITT1 = "Create a new page “Saugroboter Wartung”. The inputs come from the name table (step 3)."
S2_SCHRITT2 = "Drag 27 virtual inputs onto the page (#1–#8, #10–#13, #17, #22–#24, #26–#28, #31–#33, #37–#41), %s (#26) a second time; start value as in the column parameters."
S2_SCHRITT3 = "Create the virtual text input %s (#43), name exactly like this, “Use in visualisation” on."
S2_SCHRITT4 = "2 commands on the shared output “LoxBerry MQTT-Gateway”: %s (#16) and %s (#36), command on ON as in the table."
S2_SCHRITT5 = "Create 2 virtual inputs as push buttons, “Use in visualisation” on: #15 and #35."
S2_SCHRITT6 = "Place 8 Status, 1 Equal, 1 On-delay and 1 Notification via the block search (key F5), enter the parameters from the table and wire them according to the column “%s”."
S2_SCHRITT7 = "The status inputs from V5 on only appear after clicking the “+” on the block (#9 needs V1–V8, #42 V1–V5)."
S2_SCHRITT8 = "Enter the status rows from top to bottom – the first one that matches wins; the row without condition at the very bottom."
S2_SCHRITT9 = "Match the warning thresholds: if the plugin (tab “%s”, “%s” and “%s”) has values other than 10 hours or 10 percent, enter the same numbers in #9 and #14."
S2_H1 = "-1 always means: your device does not have or does not report this part. The status rows with “>= 0” skip it."
S2_H2 = "The push message “maintenance due” comes from the page “Saugroboter” (#13); this page shows what is due."
S2_H3 = "“Filter gewechselt” resets the counter in the robot – only press it after a real change. For another part change the value in the command %s (column parameters); the command exists only once in the whole project."
S2_H4 = "“Station gestört” reports errors of the dock; errors of the robot are reported by “Saugroboter gestört” on the page “Saugroboter”."
S3_SCHRITT1 = "Create a new page “Saugroboter Steuerung”."
S3_SCHRITT2 = "Drag 4 virtual inputs: %s (a second time), %s, %s and %s (#1–#4); start value as in the column parameters."
S3_SCHRITT3 = "Create and drag 14 commands on the shared output “LoxBerry MQTT-Gateway” (#9, #11, #20, #22, #24, #26, #28, #30, #32, #34, #36, #38, #40, #42), name and command on ON as in the table."
S3_SCHRITT4 = "Create 14 new virtual inputs as push buttons, “Use in visualisation” on (#8, #10, #12, #21, #23, #25, #27, #29, #31, #33, #35, #37, #39, #41)."
S3_SCHRITT5 = "Drag “Anwesenheit (eigene Quelle)” (#13) and “Saugen, wenn niemand da” (#14) onto the page a second time from the tree."
S3_SCHRITT6 = "Place 3 Status, 1 Equal, 1 Edge detection, 2 AND and 1 OR via the block search (key F5), enter the parameters and wire them according to the column “%s”."
S3_SCHRITT7 = "Before the first press on “Ausgewählte Räume saugen”, “Zone saugen” and “Position anfahren”: enter your own values in the command (double-click the command in the tree → “Command on ON”)."
S3_SCHRITT8 = "In the plugin, tab “%s”: tick “%s” and “%s” – all commands of this page except “piepsen lassen” intervene. Save and transfer to the Miniserver."
S3_H1 = "Every command carries exactly one fixed value. For another suction level, other rooms or another quiet time, change the value in the command (“Command on ON”); two levels side by side need a second command you create yourself in the template."
S3_H2 = "The room IDs are shown in the tab “%s” under “%s”. The plugin does not show map coordinates for %s and %s."
S3_H3 = "“Sauger heim” also works automatically: if “Saugen, wenn niemand da” is on and someone comes home during cleaning, the robot returns to the station."
S3_H4 = "Emptying, washing and drying the mop module only work if the robot has such a dock (tab “%s”, “%s”)."
S3_H5 = "Saugen starten is on the page “Saugroboter” (the command %s may only be in the project once)."
S1_SCHRITT12 = "Save and transfer to the Miniserver. Test: tab “%s” → “%s” – #25 must send a message to the phone."
S1_SCHRITT13 = "Automatic: switch on #29 in the app. From the next morning 9:00 the robot vacuums once a day as soon as nobody has been home for 10 minutes (until 18:00) and the battery has at least 60 %%."
S1_H10 = "Reinigungsdauer heute (#48) only counts while the robot is cleaning and is back at 0 at midnight."
S2_SCHRITT10 = "Notification #21: Periphery → Messages → Notification, choose the recipients. Save and transfer to the Miniserver."
S2_H5 = "If the device reports no cleaning balance, #37–#41 read -1 and #42 says “the device reports no cleaning balance”."
S3_H6 = "Every command is acknowledged: the answer is on saugrobo/befehl/<name>/quittung (“angenommen” or “abgelehnt: reason”). The same job within 5 s and the same maintenance within 60 s are rejected; suction, mop water, mode and quiet time are checked by the plugin itself (same value within 60 s: unchanged)."
Z1_01 = "Virtual Input (name as the MQTT gateway assigns it, plugin Saugroboter (Valetudo)) | saugrobo_code | state: 0 charging station, 1 ready, 2 cleaning, 3 paused, 4 returning to the station, 5 moving, 8 unknown, 9 error; start value 8 (another instance on page “Saugroboter Steuerung”) | —"
Z1_02 = "Virtual Input (name as the MQTT gateway assigns it, plugin Saugroboter (Valetudo)) | saugrobo_batt | battery in %%; -1 = the device does not report it (start value -1) | —"
Z1_03 = "Virtual Input (name as the MQTT gateway assigns it, plugin Saugroboter (Valetudo)) | saugrobo_fehler | error code, 0 = no error (another instance on page “Saugroboter Wartung”) | —"
Z1_04 = "Virtual Input (name as the MQTT gateway assigns it, plugin Saugroboter (Valetudo)) | saugrobo_matwarn | 1 = a consumable is due | —"
Z1_05 = "Virtual Input (name as the MQTT gateway assigns it, plugin Saugroboter (Valetudo)) | saugrobo_ann | 1 = message window active | —"
Z1_06 = "Virtual Input (name as the MQTT gateway assigns it, plugin Saugroboter (Valetudo)) | saugrobo_push | 1 = push released for this message | —"
Z1_07 = "Virtual Input (name as the MQTT gateway assigns it, plugin Saugroboter (Valetudo)) | saugrobo_ok | 1 = robot reachable (comes with every minute run; under gateway V2 tick “Noncached”) | —"
Z1_08 = "Virtual Input (name as the MQTT gateway assigns it, plugin Saugroboter (Valetudo)) | saugrobo_status_zaehler | heartbeat of the plugin: counts 0 to 999 and wraps, one step per minute run (never retained) | —"
Z1_09 = "Constant | Konstante 1 | value 1 | —"
