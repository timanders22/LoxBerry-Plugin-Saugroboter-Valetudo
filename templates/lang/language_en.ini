; Language file English - LoxBerry plugin Saugroboter (Valetudo)
;
; Every value is wrapped in double quotes and contains none itself. That is
; mandatory, not a matter of taste: in mode INI_SCANNER_NORMAL parse_ini_file
; fails on round brackets in unquoted values and then returns NO texts at all.
;
; English is the fallback language, not German: whoever has set a third
; language is more likely to understand English. This file must therefore
; always be complete.
;
; Loxone search patterns are NOT written out here. They come from ro_check().

